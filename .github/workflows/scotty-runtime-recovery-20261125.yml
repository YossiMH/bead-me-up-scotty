name: Recover existing Scotty runtime metadata

on:
  push:
    branches:
      - task/runtime-manifest-recovery-20261125

permissions:
  contents: read
  actions: read

concurrency:
  group: scotty-runtime-manifest-recovery-20261125
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'YossiMH/bead-me-up-scotty'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read the exact recovery packet and accepted text retainer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: ci
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            20261125/revision-8/runtime-manifest-recovery
            20261125/revision-8/type-windows/run.py

      - name: Read the exact built source for hash and Git blob comparison
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 0309539797fd7d016e2b8fd8bdc0ae9cefc20219
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Download the already-built app artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '15003467178'
          run-id: '45573503400'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/scotty-runtime-recovery-${{ github.run_id }}-${{ github.run_attempt }}/download
          merge-multiple: true

      - name: Verify and retain the complete original manifests
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          packet="$GITHUB_WORKSPACE/ci/20261125/revision-8/runtime-manifest-recovery"
          root="$RUNNER_TEMP/scotty-runtime-recovery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test "$(sha256sum "$packet/recover.py" | cut -d ' ' -f 1)" = '65b27a6f92c002a2aec271ee58fb36dac399bc71eeb583972879d6abd1ddd02a'
          test "$(sha256sum "$packet/inputs.json" | cut -d ' ' -f 1)" = 'bf06c8d8e13d407f9f2bc98c85a1677ee62883c15abe8c67e0eecbd5362f1fe0'
          python3 "$packet/recover.py" \
            --source "$GITHUB_WORKSPACE/source" --download "$root/download" \
            --inputs "$packet/inputs.json" \
            --retainer "$GITHUB_WORKSPACE/ci/20261125/revision-8/type-windows/run.py" \
            --output "$root/results"

      - name: Retain exact metadata and the recovery receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scotty-runtime-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scotty-runtime-recovery-${{ github.run_id }}-${{ github.run_attempt }}/results/
          if-no-files-found: error
          retention-days: 14
